[project]
name = "verity-redteam"
version = "0.1.0"
description = "Adversarial auditing tool for RL environment verifiers."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verity Labs" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "scipy>=1.11.0",
    "verity-core @ git+https://github.com/Verity-AI-Labs/Verity-Core.git",
    "verity-corpus @ git+https://github.com/Verity-AI-Labs/Verity-Corpus.git",
]

[project.scripts]
verity-redteam = "verity_redteam.cli:main"

[project.urls]
Homepage = "https://github.com/Verity-AI-Labs/Verity-RedTeam"
Repository = "https://github.com/Verity-AI-Labs/Verity-RedTeam"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_redteam"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
pythonpath = ["src", "."]
markers = [
    "integration: live vLLM / Docker tests skipped by default",
]
